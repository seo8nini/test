<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快樂! qaz0204/當世琉璃/c_c_r.613</title>
    <style>
        body { 
            background-color: #0b0c10; 
            color: #fff; 
            font-family: "Microsoft JhengHei", sans-serif; 
            text-align: center; 
            padding: 20px;
            margin: 0;
            user-select: none;
        }
        h1 {
            font-size: 32px;
            color: #66fcf1;
            text-shadow: 0 0 10px rgba(102,252,241,0.5);
            margin-top: 10px;
        }
        .pool-title { 
            font-size: 20px; 
            color: #c5a880; 
            margin-bottom: 30px; 
        }
        .card-container { 
            display: flex; 
            justify-content: center; 
            gap: 30px; 
            margin-top: 20px; 
            flex-wrap: wrap;
        }
        .card-wrapper { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        /* 核心卡片容器：電腦版標準 280x420 長方形 */
        .card { 
            width: 280px;  
            height: 420px; 
            cursor: pointer; 
            transition: transform 0.3s, box-shadow 0.3s; 
            position: relative; 
            border-radius: 8px;
        }
        .card:hover { 
            transform: scale(1.05); 
        }
        
        .card img {
            position: absolute;
            display: block;
        }

        /* 底層：長方形框線背景 */
        .card-frame {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; 
            border-radius: 8px;
        }

        /* 上層：正方形內容圖片置中 */
        .card-bg {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 210px;  
            height: 210px; 
            object-fit: cover; 
            z-index: 2;        
            border-radius: 6px;
        }
        
        /* 兩種邊框的陰影特效 */
        .gold-glow { box-shadow: 0 0 25px rgba(212, 175, 55, 0.6); }
        .rainbow-glow { box-shadow: 0 0 30px rgba(255, 0, 128, 0.7); }
        
        /* Change 按鈕樣式 */
        .change-btn { 
            margin-top: 15px; 
            padding: 10px 24px; 
            background: linear-gradient(135deg, #1f2833, #2c3e50);
            color: #66fcf1; 
            border: 1px solid #45f3ff; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.2s;
            font-size: 16px;
        }
        .change-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #45f3ff, #1f2833);
            color: #fff;
            box-shadow: 0 0 10px rgba(69,243,255,0.5);
        }
        .change-btn:disabled { 
            background: #151515; color: #444; border-color: #222; box-shadow: none; cursor: not-allowed; 
        }
        
        /* 🎁 已選擇紀錄區域 */
        .log { 
            margin-top: 50px; 
            font-size: 20px; 
            color: #45f3ff; 
            background-color: rgba(31, 40, 51, 0.6);
            padding: 15px; 
            border-radius: 10px; 
            display: flex; 
            justify-content: center;
            align-items: center; 
            gap: 10px; 
            border: 1px solid rgba(102,252,241,0.2);
            flex-wrap: wrap;
        }
        
        .log-icon {
            width: 64px; 
            height: 64px;
            object-fit: cover;
            border-radius: 4px;
            vertical-align: middle;
        }

        /* 結算畫面特製 CSS */
        .result-title { 
            font-size: 40px; 
            color: #ff007f; 
            text-shadow: 0 0 20px rgba(255,0,127,0.8); 
            animation: pulse 2s infinite; 
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        
        /* 核心修正：結算畫面中間的兩張選擇圖片放大 */
        .pool-title img {
            width: 200px; /* 從 120px 大幅放大到 200px */
            height: 200px; /* 保持正方形 */
            object-fit: cover; 
            border-radius: 8px;
            vertical-align: middle;
            margin: 15px; /* 增加圖片四周留白，看起來更舒服 */
        }
        
        .pool-title span {
            font-size: 32px; /* 把中間的「與」字稍微放大 */
            color: #66fcf1;
            text-shadow: 0 0 8px rgba(102,252,241,0.6);
            vertical-align: middle;
        }

        /* 當進入結算狀態時，強制讓下方的已選擇紀錄推到最下面 */
        .final-logged {
            margin-top: 80px !important;
        }

        /* ==========================================
           📱 RWD 手機版防跑版特製響應式 CSS 修正區
           ========================================== */
        @media screen and (max-width: 768px) {
            h1 {
                font-size: 24px; 
            }
            .pool-title {
                font-size: 16px;
                margin-bottom: 15px;
            }
            .card-container {
                gap: 15px; 
            }
            .card {
                width: 224px;
                height: 336px;
            }
            .card-bg {
                width: 168px;
                height: 168px;
            }
            .change-btn {
                padding: 8px 18px;
                font-size: 14px; 
                margin-top: 10px;
            }
            .log {
                font-size: 16px;
                padding: 10px;
            }
            .log-icon {
                width: 48px; 
                height: 48px;
            }
            /* 手機版結算圖片微調，避免超出手機螢幕 */
            .pool-title img {
                width: 140px; 
                height: 140px;
                margin: 10px 5px;
            }
            .pool-title span {
                font-size: 24px;
            }
            .final-logged {
                margin-top: 40px !important;
            }
        }
    </style>
</head>
<body>

    <h1 id="roundTitle">第一輪：金色獎池</h1>
    <div id="poolSubtitle" class="pool-title">請點選一張卡片作為你的生日禮物</div>

    <div class="card-container" id="cardContainer"></div>

    <div>
        <div class="log" id="logHistory">
            <span style="color: #45f3ff;">🎁 已選擇紀錄：</span>
            目前尚未選擇任何獎勵
        </div>
    </div>

<script>
    // 金色池：g1 ~ g13
    const goldPool = [];
    for(let i = 1; i <= 13; i++) {
        goldPool.push({
            id: i,
            name: i === 13 ? "【質變 : 稜彩】" : `金色獎勵 ${i}`,
            fileName: `g${i}.png`,
            isSpecial: i === 13, 
            frame: 'gd_inframe.png',
            glowClass: 'gold-glow'
        });
    }

    // 彩色池：r1 ~ r8
    const rainbowPool = [];
    for(let i = 1; i <= 8; i++) {
        rainbowPool.push({
            id: i + 100, 
            name: `彩色大獎 ${i}`,
            fileName: `r${i}.png`,
            isSpecial: false,
            frame: 'rb_inframe.png',
            glowClass: 'rainbow-glow'
        });
    }

    let currentStage = 1; 
    let currentSlots = []; 
    let history = []; 

    function hasG13Appeared() {
        return currentSlots.some(slot => slot.data && (slot.data.id === 13 || slot.hasMutated));
    }

    function getRandomCard(pool, excludeIds, isGoldPool) {
        const historyIds = history.map(item => item.id);
        const allExcludeIds = [...new Set([...excludeIds, ...historyIds])];

        let available = pool.filter(item => !allExcludeIds.includes(item.id));
        
        if (isGoldPool && hasG13Appeared()) {
            available = available.filter(item => item.id !== 13);
        }
        
        if (available.length === 0) return pool[Math.floor(Math.random() * pool.length)];
        return available[Math.floor(Math.random() * available.length)];
    }

    function initRound() {
        const pool = currentStage === 1 ? goldPool : rainbowPool;
        const currentPoolType = currentStage === 1 ? 'gold' : 'rainbow';
        document.getElementById('roundTitle').innerText = currentStage === 1 ? "第一輪：金色獎池" : "第二輪：彩色獎池";
        document.getElementById('poolSubtitle').innerText = currentStage === 1 ? "請點選一張卡片作為你的生日禮物" : "請從中選擇一個獎勵";
        
        const selectedIds = history.map(item => item.id);
        let availablePool = pool.filter(item => !selectedIds.includes(item.id));
        
        if (availablePool.length < 3) availablePool = pool;

        let shuffled = [...availablePool].sort(() => 0.5 - Math.random());
        
        currentSlots = [
            { data: shuffled[0], changeDisabled: false, poolType: currentPoolType, hasMutated: false },
            { data: shuffled[1], changeDisabled: false, poolType: currentPoolType, hasMutated: false },
            { data: shuffled[2], changeDisabled: false, poolType: currentPoolType, hasMutated: false }
        ];

        renderCards();
    }

    function renderCards() {
        const container = document.getElementById('cardContainer');
        container.innerHTML = '';

        currentSlots.forEach((slot, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';

            const card = document.createElement('div');
            card.className = `card ${slot.data.glowClass}`;
            
            card.onclick = () => handleCardClick(index);

            const imgFrame = document.createElement('img');
            imgFrame.className = 'card-frame';
            imgFrame.src = slot.data.frame;

            const imgBg = document.createElement('img');
            imgBg.className = 'card-bg';
            imgBg.src = slot.data.fileName;

            card.appendChild(imgFrame);
            card.appendChild(imgBg);

            const btn = document.createElement('button');
            btn.className = 'change-btn';
            btn.innerText = slot.changeDisabled ? '已鎖定' : 'Change (不限次數)'; 
            btn.disabled = slot.changeDisabled; 
            
            if (!slot.changeDisabled) {
                btn.onclick = (e) => {
                    e.stopPropagation(); 
                    changeCard(index);
                };
            }

            wrapper.appendChild(card);
            wrapper.appendChild(btn);
            container.appendChild(wrapper);
        });
    }

    function changeCard(index) {
        const isGold = currentSlots[index].poolType === 'gold';
        const pool = isGold ? goldPool : rainbowPool;
        const currentIds = currentSlots.map(s => s.data.id);
        
        const newCard = getRandomCard(pool, currentIds, isGold);
        currentSlots[index].data = newCard;
        renderCards();
    }

    function handleCardClick(index) {
        const slot = currentSlots[index];
        
        if (currentStage === 1 && slot.poolType === 'gold' && slot.data.isSpecial && !slot.hasMutated) {
            alert("✨ 握曹！恐怖如斯，簡直恐怖如斯✨");
            
            const selectedRainbowIds = history.map(item => item.id);
            let availableRainbows = rainbowPool.filter(item => !selectedRainbowIds.includes(item.id));
            if (availableRainbows.length === 0) availableRainbows = rainbowPool;
            
            const randomRainbow = availableRainbows[Math.floor(Math.random() * availableRainbows.length)];
            
            slot.data = { ...randomRainbow };
            slot.hasMutated = true;
            slot.changeDisabled = true; 
            
            renderCards();
            return;
        }

        const selected = slot.data;
        history.push({ ...selected }); 
        updateLog();

        if (currentStage === 1) {
            currentStage = 2;
            initRound(); 
        } else {
            showFinalResult();
        }
    }

    function updateLog() {
        const logHistory = document.getElementById('logHistory');
        logHistory.innerHTML = '<span style="color: #45f3ff;">🎁 已選擇紀錄：</span>';
        
        if (history.length === 0) {
            logHistory.innerHTML += "目前尚未選擇任何獎勵";
            return;
        }

        history.forEach((selected, i) => {
            const miniImg = document.createElement('img');
            miniImg.src = selected.fileName; 
            miniImg.className = 'log-icon';
            if (selected.glowClass === 'gold-glow') {
                miniImg.style.boxShadow = '0 0 10px rgba(212, 175, 55, 0.4)';
                miniImg.style.border = '1px solid rgba(212, 175, 55, 0.3)';
            } else if (selected.glowClass === 'rainbow-glow') {
                miniImg.style.boxShadow = '0 0 10px rgba(255, 0, 128, 0.5)';
                miniImg.style.border = '1px solid rgba(255, 0, 128, 0.4)';
            }
            logHistory.appendChild(miniImg);

            if (i < history.length - 1) {
                const arrow = document.createElement('span');
                arrow.innerText = ' ➔ ';
                arrow.style.color = '#c5a880';
                logHistory.appendChild(arrow);
            }
        });
    }

    function showFinalResult() {
        document.getElementById('roundTitle').className = "result-title";
        document.getElementById('roundTitle').innerText = "🎂祝生日快樂🎂\n🎂c_c_r.613🎂\n🎂qaz0204🎂\n🎂內湖力貝爾🎂";
        
        const poolSubtitle = document.getElementById('poolSubtitle');
        poolSubtitle.innerHTML = `<h3>牛逼克拉斯！最終獎勵：</h3>`;

        // 核心修正：將下方的紀錄區塊加上額外的間距，讓它靠下排版
        document.getElementById('logHistory').classList.add('final-logged');

        history.forEach((selected, i) => {
            const resultImg = document.createElement('img');
            resultImg.src = selected.fileName; 
            resultImg.style.boxShadow = selected.glowClass === 'gold-glow' ? '0 0 25px rgba(212, 175, 55, 0.7)' : '0 0 30px rgba(255, 0, 128, 0.8)';
            resultImg.style.border = selected.glowClass === 'gold-glow' ? '3px solid rgba(212, 175, 55, 0.5)' : '3px solid rgba(255, 0, 128, 0.6)';
            poolSubtitle.appendChild(resultImg);

            if (i < history.length - 1) {
                const arrow = document.createElement('span');
                arrow.innerText = ' 與 ';
                poolSubtitle.appendChild(arrow);
            }
        });
        
        document.getElementById('cardContainer').innerHTML = '';
    }

    initRound();
</script>
</body>
</html>
